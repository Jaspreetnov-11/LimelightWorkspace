# Limelight Search: SearXNG on JASPREET for Limelight AI's web search. Only the relay (relay.py, LAN port 8890)
# talks to it, so it listens on this PC only. The secret key comes from SEARXNG_SECRET (start-search.ps1).
use_default_settings: true
general:
  instance_name: "Limelight Search"
  enable_metrics: false
search:
  safe_search: 0
  formats: [html, json]
server:
  port: 8888
  bind_address: "127.0.0.1"
  limiter: false
  image_proxy: false
  public_instance: false
ui:
  default_locale: "en"
outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
