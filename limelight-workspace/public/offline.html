<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Limelight</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #f2f2f2; font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 18px; }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.3px; }
  p { margin: 0 0 22px; color: #9a9aa5; max-width: 300px; }
  button { border: 0; border-radius: 999px; padding: 12px 26px; background: #ffc21a; color: #1a1300; font: 700 15px inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/img/icon-192.png" alt="">
  <h1>No connection</h1>
  <p>Limelight needs the internet. Check your Wi-Fi or mobile data, then try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
