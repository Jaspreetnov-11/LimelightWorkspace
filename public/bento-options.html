<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bento Options</title>
<style>
@font-face { font-family: 'Inter'; src: url(fonts/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; }
body { margin: 0; background: #050508; color: #fff; font: 14px/1.5 Inter, 'Segoe UI', sans-serif; padding: 30px 26px 60px; }
.page-h { max-width: 1400px; margin: 0 auto 24px; }
.page-h h1 { margin: 0; font-size: 26px; letter-spacing: -.5px; }
.page-h p { margin: 4px 0 0; color: #ffffffa6; }
.grid { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(600px, 1fr)); gap: 30px; }
@media (max-width: 660px) { .grid { grid-template-columns: 1fr; } body { padding: 18px 16px; } }
.opt h2 { font-size: 16px; margin: 0 0 2px; } .opt h2 span { color: #ffc21a; font-size: 13px; margin-left: 8px; }
.opt > p { color: #ffffffa6; margin: 0 0 10px; font-size: 13px; }
.frame { position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; border: 1px solid #ffffff22; }
.mock { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; overflow: hidden; padding: 14px 20px; display: flex; flex-direction: column;
  background: radial-gradient(circle at 14% 18%, #7c3aed70, transparent 38%), radial-gradient(circle at 86% 8%, #ffc21a5c, transparent 36%),
  radial-gradient(circle at 62% 96%, #0ea5e95e, transparent 42%), radial-gradient(circle at 4% 92%, #db277738, transparent 34%), #07070c; }
.mock * { box-sizing: border-box; }
svg { display: block; }
.g { background: #ffffff12; border: 1px solid #ffffff26; backdrop-filter: blur(22px); border-radius: 24px; }
.top { display: flex; align-items: center; padding: 7px 10px 7px 16px; border-radius: 18px; flex: none; }
.top img { height: 18px; } .top .w { color: #ffc21a; font-weight: 600; margin-left: 9px; padding-left: 9px; border-left: 1px solid #ffffff30; font-size: 12px; }
.top .pills { margin: 0 auto; display: flex; gap: 4px; background: #00000026; padding: 3px; border-radius: 12px; font-size: 12px; }
.top .pills b, .top .pills span { padding: 5px 14px; border-radius: 9px; color: #ffffffa6; font-weight: 500; } .top .pills b { background: #ffffff2a; color: #fff; }
.top .av { width: 28px; height: 28px; border-radius: 50%; background: #ffc21a; color: #1a1300; display: grid; place-items: center; font-weight: 800; font-size: 11px; }
.hero { text-align: center; padding: 16px 0 14px; flex: none; }
.hero img { height: 52px; filter: drop-shadow(0 8px 40px #ffc21a40); }
.hero p { color: #ffffffa6; margin: 2px 0 10px; font-size: 12px; }
.spot { width: 560px; margin: 0 auto; height: 44px; border-radius: 14px; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #ffffff80; font-size: 16px;
  background: #ffffff1a; border: 1px solid #ffffff30; }
.spot kbd { margin-left: auto; font: 500 10px Inter; border: 1px solid #ffffff30; border-radius: 5px; padding: 1px 6px; }
.lower { flex: 1; min-height: 0; padding: 4px 2px 6px; }
.b { display: grid; gap: 12px; height: 100%; }
.t { border-radius: 24px; padding: 18px 20px; position: relative; overflow: hidden; min-height: 0; }
.t h3 { margin: 0; font-size: 17px; letter-spacing: -.2px; display: flex; align-items: center; gap: 8px; }
.t h3 svg { width: 20px; height: 20px; }
.t small, .muted { color: #ffffffa6; font-size: 12px; }
.dim { color: #ffffff6b; }
.big { font-size: 46px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
.n { background: #ffc21a; color: #1a1300; font-size: 10px; font-weight: 800; border-radius: 9px; padding: 1px 6px; }
.msg { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; min-width: 0; }
.msg i { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 11px; color: #111; }
.msg span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ffffffb8; }
.msg em { font-style: normal; color: #ffffff6b; font-size: 11px; }
.tk { display: flex; align-items: center; gap: 10px; margin-top: 9px; font-size: 13px; }
.tk b { width: 15px; height: 15px; border: 1.5px solid #ffffff70; border-radius: 5px; flex: none; }
.tk em { margin-left: auto; font-style: normal; color: #ffffff6b; font-size: 11px; }
.th { border-radius: 12px; background: linear-gradient(135deg, #111 55%, #ffc21a 55%); }
.th.b2 { background: linear-gradient(160deg, #0d1b3d, #1f4fd1); } .th.o { background: linear-gradient(160deg, #3a1a05, #ff8a3d); } .th.p { background: linear-gradient(160deg, #2a0b40, #c084fc); } .th.w { background: #f4f1ea; }
.ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; }
.ic svg { width: 24px; height: 24px; }
.bgicon { position: absolute; right: -14px; bottom: -18px; opacity: .13; } .bgicon svg { width: 140px; height: 140px; }
.arrow { position: absolute; right: 16px; top: 16px; width: 28px; height: 28px; border-radius: 50%; background: #ffffff1c; display: grid; place-items: center; font-size: 13px; }
.dotg { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 8px #3ddc84; display: inline-block; }
.dotr { width: 7px; height: 7px; border-radius: 50%; background: #ff6b6b; display: inline-block; }
.clock { font-size: 54px; font-weight: 200; letter-spacing: -2px; line-height: 1; }
.prompt { margin-top: 12px; background: #0005; border: 1px solid #ffffff22; border-radius: 14px; padding: 11px 14px; color: #ffffff80; font-size: 13px; display: flex; }
.prompt b { margin-left: auto; color: #ffc21a; }
</style>
</head>
<body>
<div class="page-h"><h1>Bento Home — 6 options</h1><p>Upar logo + search same. Neeche ka hissa Bento tiles mein — har tile apna kaam dikhata hai aur click se khulta hai. Number bataiye (mix bhi chalega).</p></div>
<div class="grid" id="grid"></div>

<template id="topHero">
  <div class="top g"><img src="img/limelight-logo-white.png" alt=""><span class="w">Lighthouse</span>
    <div class="pills"><b>Home</b><span>Chats</span><span>Create</span><span>Library</span></div><div class="av">JS</div></div>
  <div class="hero"><img src="img/limelight-logo-white.png" alt=""><p>Good morning, Jaspreet</p>
    <div class="spot">⌕ Search<kbd>Ctrl K</kbd></div></div>
</template>

<script>
const P = {
  edit: '<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/><path d="M4 8.5h2.5M4 15.5h2.5M17.5 8.5H20M17.5 15.5H20"/>',
  design: '<path d="M14.5 4.5l5 5L10 19H5v-5z"/><path d="M12.5 6.5l5 5"/><circle cx="7.5" cy="16.5" r="1" fill="currentColor"/>',
  office: '<rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M4 9h16"/><path d="M8 13h3M8 16h6"/><circle cx="16.5" cy="14.5" r="1.5"/>',
  ai: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',
  chats: '<path d="M5 5.5h11a2.5 2.5 0 0 1 2.5 2.5v5.5A2.5 2.5 0 0 1 16 16H10l-4.5 3.5V16H5a2.5 2.5 0 0 1-2.5-2.5V8A2.5 2.5 0 0 1 5 5.5z"/><path d="M7 10h7M7 12.8h4.5"/><path d="M21.5 10.5v6a2 2 0 0 1-2 2h-.5"/>',
  check: '<rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.5 12.2l2.4 2.4 4.8-5"/>',
  mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M4 7l8 6 8-6"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
};
const ic = (k, w = 1.9) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[k]}</svg>`;
const C = { edit: '#ff8a3d', design: '#ffc21a', office: '#5b8cff', ai: '#c084fc', chats: '#2dd4bf', tasks: '#3ddc84' };
const chatRows = (n = 3) => [['DT', '#2dd4bf', 'Design Team', 'Poster v3 ready hai', '10:12', 2], ['R', '#ff8a3d', 'Rahul', 'Footage upload ho gaya', '9:58', 1], ['A', '#c084fc', 'Accounts', 'Invoice bhej do', 'Kal', 0], ['P', '#5b8cff', 'Priya', 'Meeting 4 baje', 'Kal', 0]]
  .slice(0, n).map(([i, c, w, m, t, u]) => `<div class="msg"><i style="background:${c}">${i}</i><b>${w}</b><span>${m}</span>${u ? `<span class="n" style="flex:none">${u}</span>` : `<em>${t}</em>`}</div>`).join('');
const taskRows = (n = 3) => [['VBYLD reel final cut', '12:00'], ['Ministry proposal deck', '3:00'], ['Payroll check', '5:00']].slice(0, n).map(([t, d]) => `<div class="tk"><b></b>${t}<em>${d}</em></div>`).join('');
const thumbs = (h, list = ['', 'b2', 'o', 'p']) => `<div style="display:flex;gap:8px;margin-top:12px">${list.map((c) => `<div class="th ${c}" style="width:${h * .78}px;height:${h}px"></div>`).join('')}</div>`;

const OPTS = [
  ['Classic Bento', 'saaf glass tiles', 'Bade-chhote glass tiles: Chats (bada), Tasks, AI se banao, Recent designs, aur apps ke tiles. Sab ek nazar mein.', `
  <div class="b" style="grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr">
    <div class="t g" style="grid-column:span 2;grid-row:span 2"><h3 style="color:${C.chats}">${ic('chats')}Chats <span class="n">3</span></h3>${chatRows(4)}<div class="arrow">→</div></div>
    <div class="t g" style="grid-column:span 2"><h3 style="color:${C.tasks}">${ic('check')}Aaj ke tasks</h3>${taskRows(2)}</div>
    <div class="t g" style="background:linear-gradient(150deg,${C.edit}55,#ffffff0d)"><h3>${ic('edit')}Edit</h3><small>3 projects</small><div class="bgicon">${ic('edit', 1.2)}</div></div>
    <div class="t g" style="background:linear-gradient(150deg,${C.office}55,#ffffff0d)"><h3>${ic('office')}Office</h3><small>4 mails</small><div class="bgicon">${ic('office', 1.2)}</div></div>
    <div class="t g" style="grid-column:span 2;background:radial-gradient(circle at 90% 0,${C.ai}55,transparent 60%),#ffffff12"><h3 style="color:${C.ai}">${ic('ai')}Limelight AI</h3><div class="prompt">Image ya video describe karo…<b>✦</b></div></div>
    <div class="t g" style="grid-column:span 2"><h3 style="color:${C.design}">${ic('design')}Recent designs</h3>${thumbs(78, ['', 'b2', 'w'])}</div>
  </div>`],
  ['Big Numbers', 'bade numbers wale tiles', 'Har tile par ek bada number — unread chats, tasks, mails, designs — aur neeche chhota detail. Turant samajh aata hai kya pending hai.', `
  <div class="b" style="grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr">
    ${[['chats', 'Unread chats', '5', 'Design Team · Rahul'], ['tasks', 'Aaj ke tasks', '3', 'VBYLD reel · Deck'], ['office', 'Naye mails', '4', 'Ministry, Accounts'], ['design', 'Designs is hafte', '12', 'Last: Instagram Post']]
      .map(([k, l, n, d]) => `<div class="t g"><div class="big" style="color:${C[k]}">${n}</div><h3 style="margin-top:14px;font-size:15px">${l}</h3><small>${d}</small><div class="bgicon">${ic(k === 'tasks' ? 'check' : k === 'design' ? 'design' : k, 1.2)}</div></div>`).join('')}
    <div class="t g" style="grid-column:span 2"><h3>Aaj</h3>${chatRows(2)}${taskRows(1)}</div>
    <div class="t g" style="background:linear-gradient(150deg,${C.edit}66,${C.ai}44)"><h3>${ic('edit')}Edit</h3><small>KYV reel v2 render ready</small></div>
    <div class="t g" style="background:linear-gradient(150deg,${C.ai}66,#0ea5e944)"><h3>${ic('ai')}AI se banao</h3><small>Image · Video</small></div>
  </div>`],
  ['Preview Tiles', 'andar ka kaam dikhe', 'Tiles mein asli content ka preview: designs ki photos, video ka frame, mail ka subject, chat ke messages — app khole bina dikhta hai.', `
  <div class="b" style="grid-template-columns:1.3fr 1fr 1fr;grid-template-rows:1fr 1fr">
    <div class="t g" style="grid-row:span 2;padding:0"><div class="th" style="position:absolute;inset:0;border-radius:24px;background:linear-gradient(135deg,#111 50%,#ffc21a 50%)"></div>
      <div style="position:absolute;left:0;right:0;bottom:0;padding:18px 20px;background:linear-gradient(transparent,#000c)"><h3>${ic('design')}Design</h3><small>Instagram Post · 08:56</small></div></div>
    <div class="t g" style="padding:0"><div class="th o" style="position:absolute;inset:0;border-radius:24px"></div><div style="position:absolute;inset:0;display:grid;place-items:center"><div style="width:52px;height:52px;border-radius:50%;background:#0008;display:grid;place-items:center">▶</div></div>
      <div style="position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:linear-gradient(transparent,#000c)"><h3>${ic('edit')}Edit</h3><small>KYV reel v2 · render ready</small></div></div>
    <div class="t g"><h3 style="color:${C.office}">${ic('mail')}Mail</h3><div class="msg"><b>Ministry</b><span>Proposal feedback</span></div><div class="msg"><b>Accounts</b><span>Invoice #224</span></div><div class="msg"><b>HR</b><span>Diwali leave list</span></div></div>
    <div class="t g"><h3 style="color:${C.chats}">${ic('chats')}Chats</h3>${chatRows(3)}</div>
    <div class="t g"><h3 style="color:${C.tasks}">${ic('check')}Tasks</h3>${taskRows(3)}</div>
  </div>`],
  ['Hero Mosaic', 'ek bada "Aaj" tile', 'Left mein ek bada tile: ghadi, date, check-in aur aaj ka plan. Right mein chhote tiles ka mosaic — apps aur updates.', `
  <div class="b" style="grid-template-columns:1.1fr 1fr 1fr 1fr;grid-template-rows:1fr 1fr">
    <div class="t g" style="grid-row:span 2;background:radial-gradient(circle at 0 0,#ffc21a44,transparent 60%),#ffffff12"><div class="clock">10:24</div><small>Thursday, 29 October · Check-in 9:42</small>
      <h3 style="margin-top:22px">Aaj ka plan</h3>${taskRows(3)}<div class="msg" style="margin-top:14px"><i style="background:#2dd4bf">DT</i><b>Design Team</b><span>Poster v3 ready</span></div></div>
    ${['edit', 'design', 'office'].map((k) => `<div class="t g" style="display:flex;flex-direction:column;justify-content:space-between"><div class="ic" style="background:${C[k]};color:#111">${ic(k)}</div><div><h3>${k === 'edit' ? 'Edit' : k === 'design' ? 'Design' : 'Office'}</h3><small>${k === 'edit' ? '3 projects' : k === 'design' ? '12 designs' : '4 mails · 3 tasks'}</small></div></div>`).join('')}
    <div class="t g" style="grid-column:span 2"><h3 style="color:${C.chats}">${ic('chats')}Chats <span class="n">3</span></h3>${chatRows(2)}</div>
    <div class="t g" style="background:linear-gradient(150deg,${C.ai}55,#ffffff0d)"><div class="ic" style="background:${C.ai};color:#111">${ic('ai')}</div><h3 style="margin-top:12px">Limelight AI</h3><small>Image · Video · Ask</small></div>
  </div>`],
  ['Colour Widgets', 'Apple widgets jaise', 'Har tile apne app ke rang mein bhara hua (solid gradient), bade rounded corners — iPhone/Mac widgets jaisa, sabse rangeen.', `
  <div class="b" style="grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr">
    <div class="t" style="grid-column:span 2;background:linear-gradient(150deg,#14b8a6,#0e7490);border-radius:30px"><h3>${ic('chats')}Chats</h3>${chatRows(3).replaceAll('#ffffffb8', '#ffffffe0')}</div>
    <div class="t" style="background:linear-gradient(150deg,#22c55e,#15803d);border-radius:30px"><div class="big">3</div><h3 style="margin-top:12px">Aaj ke tasks</h3><small style="color:#ffffffd0">VBYLD reel · Deck</small></div>
    <div class="t" style="background:linear-gradient(150deg,#3b82f6,#1e40af);border-radius:30px"><div class="big">4</div><h3 style="margin-top:12px">Naye mails</h3><small style="color:#ffffffd0">Office</small></div>
    <div class="t" style="background:linear-gradient(150deg,#fb923c,#c2410c);border-radius:30px"><h3>${ic('edit')}Edit</h3><small style="color:#ffffffd0">KYV reel v2 ready</small><div class="bgicon" style="opacity:.25">${ic('edit', 1.2)}</div></div>
    <div class="t" style="background:linear-gradient(150deg,#facc15,#ca8a04);border-radius:30px;color:#1a1300"><h3>${ic('design')}Design</h3><small style="color:#1a1300b0">Instagram Post</small><div class="bgicon" style="opacity:.25">${ic('design', 1.2)}</div></div>
    <div class="t" style="grid-column:span 2;background:linear-gradient(150deg,#a855f7,#6d28d9);border-radius:30px"><h3>${ic('ai')}Limelight AI</h3><div class="prompt" style="background:#0003">Kya banana hai? Image ya video…<b style="color:#fff">✦</b></div></div>
  </div>`],
  ['Slim Bento', 'kam jagah, saaf', 'Do patli rows: upar 5 app tiles (har ek par live info), neeche 3 info tiles. Kam bheed, sab kuch neat line mein.', `
  <div class="b" style="grid-template-columns:repeat(5,1fr);grid-template-rows:auto 1fr">
    ${[['edit', 'Edit', '3 projects'], ['design', 'Design', '12 designs'], ['office', 'Office', '4 mails'], ['ai', 'Limelight AI', 'Ask · Create'], ['chats', 'Chats', '3 unread']].map(([k, n, d], i) =>
      `<div class="t g" style="display:flex;align-items:center;gap:12px;padding:14px"><div class="ic" style="background:${C[k]}33;color:${C[k]}">${ic(k)}</div><div><h3 style="font-size:15px">${n}</h3><small>${d}</small></div><span style="margin-left:auto" class="${i === 0 || i === 3 ? 'dotr' : 'dotg'}"></span></div>`).join('')}
    <div class="t g" style="grid-column:span 2"><h3 style="color:${C.chats}">${ic('chats')}Chats</h3>${chatRows(4)}</div>
    <div class="t g" style="grid-column:span 2"><h3 style="color:${C.tasks}">${ic('check')}Tasks</h3>${taskRows(3)}</div>
    <div class="t g"><h3 style="color:${C.design}">${ic('image')}Recent</h3>${thumbs(64, ['', 'b2'])}${thumbs(64, ['o', 'p'])}</div>
  </div>`],
];
const tpl = document.getElementById('topHero').innerHTML;
document.getElementById('grid').innerHTML = OPTS.map(([n, tag, d, lower], i) =>
  `<section class="opt"><h2>${i + 1} · ${n}<span>${tag}</span></h2><p>${d}</p><div class="frame"><div class="mock">${tpl}<div class="lower">${lower}</div></div></div></section>`).join('');
const fit = () => document.querySelectorAll('.frame').forEach((f) => { f.firstElementChild.style.transform = `scale(${f.clientWidth / 1280})`; });
addEventListener('resize', fit); fit();
</script>
</body>
</html>
